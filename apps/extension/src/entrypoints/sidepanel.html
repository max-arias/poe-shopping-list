<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoE Shopping List</title>
    <style>
      :root {
        color-scheme: dark;
        --boot-bg: #11100e;
        --boot-frame: #0b0a09;
        --boot-chrome: #171512;
        --boot-surface: #191714;
        --boot-tab: #211e1a;
        --boot-ink: #e9e0d2;
        --boot-muted: #988d7e;
        --boot-stroke: #40392f;
        --boot-line: #342e27;
        --boot-accent: #e5a83b;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--boot-bg);
        color: var(--boot-ink);
      }

      body {
        width: 100%;
        max-width: 380px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }

      #app {
        min-height: 100vh;
        background: var(--boot-bg);
        color: var(--boot-ink);
      }

      .boot-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--boot-frame);
      }

      .boot-nav {
        height: 31px;
        display: flex;
        align-items: end;
        gap: 16px;
        padding: 0 12px;
        border-bottom: 1px solid var(--boot-stroke);
        background: var(--boot-tab);
      }

      .boot-tab {
        height: 30px;
        display: flex;
        align-items: center;
        color: var(--boot-muted);
        font-size: 11px;
      }

      .boot-tab-active {
        color: var(--boot-ink);
        border-bottom: 2px solid var(--boot-accent);
      }

      .boot-list {
        flex: 1;
        padding: 12px;
      }

      .boot-list-label {
        width: 72px;
        height: 8px;
        margin: 2px 0 12px;
        background: var(--boot-line);
        border-radius: 2px;
      }

      .boot-row {
        height: 38px;
        display: flex;
        align-items: center;
        gap: 9px;
        border-bottom: 1px solid var(--boot-line);
      }

      .boot-checkbox {
        width: 12px;
        height: 12px;
        border: 1px solid var(--boot-stroke);
        border-radius: 2px;
      }

      .boot-copy {
        width: 54%;
        height: 8px;
        background: var(--boot-surface);
        border-radius: 2px;
      }

      .boot-price {
        width: 28px;
        height: 8px;
        margin-left: auto;
        background: var(--boot-line);
        border-radius: 2px;
      }

      .boot-footer {
        min-height: 30px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        border-top: 1px solid var(--boot-stroke);
        background: var(--boot-chrome);
      }

      .boot-footer-line {
        width: 96px;
        height: 7px;
        background: var(--boot-line);
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-shell" aria-hidden="true">
        <nav class="boot-nav">
          <span class="boot-tab boot-tab-active">LIST</span>
          <span class="boot-tab">MINE</span>
        </nav>
        <main class="boot-list">
          <div class="boot-list-label"></div>
          <div class="boot-row">
            <span class="boot-checkbox"></span><span class="boot-copy"></span
            ><span class="boot-price"></span>
          </div>
          <div class="boot-row">
            <span class="boot-checkbox"></span><span class="boot-copy" style="width: 43%"></span
            ><span class="boot-price"></span>
          </div>
          <div class="boot-row">
            <span class="boot-checkbox"></span><span class="boot-copy" style="width: 62%"></span
            ><span class="boot-price"></span>
          </div>
        </main>
        <footer class="boot-footer"><span class="boot-footer-line"></span></footer>
      </div>
    </div>
    <script type="module" src="./sidepanel/main.ts"></script>
  </body>
</html>
